name: Terraform

on:
  pull_request:
    paths: ["terraform/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VAR_project_name: devops-assessment
  TF_VAR_environment: dev
  TF_VAR_aws_region: ap-south-1
  TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
  TF_VAR_github_repo: ${{ github.repository }}
  TRIVY_IMAGE: aquasec/trivy:latest   # pin to a fixed version in production

jobs:
  # IaC security scan: reports misconfigurations in the Terraform code
  iac-scan:
    name: IaC security scan (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Terraform for misconfigurations
        run: |
          docker run --rm -v ${{ github.workspace }}/terraform:/src \
            ${{ env.TRIVY_IMAGE }} config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            /src
        # exit-code 0 = report only. Some findings are intentional for this
        # assessment (public ALB, broad CI role). Set to 1 to enforce.

  terraform:
    name: Format, validate, plan, apply
    needs: iac-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive ../../
      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan

      - name: Apply (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
